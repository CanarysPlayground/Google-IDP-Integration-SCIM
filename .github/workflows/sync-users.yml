name: Google Workspace → GitHub EMU Synchronization

# Manual trigger only. There is no schedule:
#   - Provisioning (create/update) happens whenever someone runs this by hand.
#   - Suspension is a separate, deliberate decision via the `suspend` input.
# This keeps the group list fully visible and editable at the point of every
# run, instead of it silently coming from a secret or a stale default.
on:
  workflow_dispatch:
    inputs:
      groups_json:
        description: >
          JSON object mapping Google Group emails to the GitHub role they
          grant. To onboard a new group, edit this default value (in the
          workflow file) and add another "email":"role" pair, keeping the
          existing ones as they are.
        required: true
        default: '{"github-enterprise-owners@yourdomain.com":"enterprise_owner","github-enterprise-members@yourdomain.com":"enterprise_member"}'

      suspend:
        description: "De-provision (suspend) stale users found in this run."
        required: true
        type: boolean
        default: false

      dry_run:
        description: "Run without making any changes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-emu-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize Google Workspace Users
    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      GITHUB_ENTERPRISE: ${{ secrets.GITHUB_ENTERPRISE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      GOOGLE_ADMIN_USER: ${{ secrets.GOOGLE_ADMIN_USER }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GOOGLE_GROUPS_JSON: ${{ github.event.inputs.groups_json }}
      ENABLE_SUSPEND: ${{ github.event.inputs.suspend }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}

      MAX_RETRIES: 5
      RETRY_BACKOFF: 2
      MAX_SUSPEND_RATIO: 0.2

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google Service Account File
        run: |
          cat > service-account.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Verify Environment
        run: |
          echo "Enterprise     : ${GITHUB_ENTERPRISE}"
          echo "Groups         : ${GOOGLE_GROUPS_JSON}"
          echo "Enable Suspend : ${ENABLE_SUSPEND}"
          echo "Dry Run        : ${DRY_RUN}"

      - name: Execute Synchronization
        run: |
          python sync-users.py

      - name: Upload CSV Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: reports/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: logs/

      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f service-account.json
